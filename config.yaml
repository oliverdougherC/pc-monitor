# PC Monitor - desk display config
# NOTE: keys are consumed by app/config.py; missing keys fall back to defaults there.

display:
  # Once hardware arrives set revision to the right protocol:
  #   SIMU = simulated display (web preview on http://localhost:5678)
  #   C    = Turing Smart Screen 5" (classic)      TUR_USB = newer TURZX USB models
  # Connected unit (2026-09-23): enumerates as a built-in USB2.0 hub whose awake
  # side is the CDC-ACM gadget 1d6b:0106 (serial 20080411) = COM port, with the
  # sleeping side 1A86:CA21 "UsbMonitor"/"CT21INCH" used to wake it. That pairing
  # is exactly what library/lcd/lcd_comm_rev_c.py auto-detects, so revision C.
  revision: C
  com_port: AUTO
  # portrait/native panel dims (rotated to landscape below). 5" Turing = 480x800
  portrait_width: 480
  portrait_height: 800
  orientation: landscape
  # Reboot the panel on every start. Off: the app handshakes first and only reaches
  # for a reboot if the screen does not answer, because that reboot's write blocks
  # forever on a panel whose USB endpoint has stopped draining - which looks like a
  # broken app and is only fixable by pulling the cable. Set true to restore the
  # vendor's always-reboot order.
  reset_on_start: false
  # Last resort that does not need a hand on the cable. After 2 minutes of silence the
  # app steps through three rungs, one per attempt: restart the CDC interface, restart
  # the composite device above it, then disable+re-enable that device (as close to
  # pulling the plug as Windows allows; the intent is journaled in .panel_reset_pending
  # so a crash between the two words is finished by the next start). Measured on this
  # desk - when the endpoint has stopped draining, the COM port still opens but the
  # first write blocks, so no command (including the vendor's RESTART) can ever be
  # delivered. Needs Administrator; without it the refusal is logged and retried.
  usb_restart_on_fail: true
  # One [beat] line per this many seconds proving the loop is alive and saying what it
  # decided (state, light reason, panel link, fps). 0 disables it; 0 < x also fine.
  heartbeat_s: 900
  brightness_idle: 45     # %
  brightness_game: 70     # %
  brightness_dim: 12      # % when nobody has touched the PC for a while
  screen_off_after_min: 45
  # The step before screen-off: after this many seconds of no input the panel drops
  # to brightness_dim instead of sitting at full brightness on an empty desk.
  dim_after_s: 300
  # Both timers above measure keyboard and mouse only (GetLastInputInfo), so a player
  # on a controller looks like an empty desk and would get a dimmed panel at 5 minutes
  # and a dark one at 45. While the locked game is presenting live frames, hold them;
  # an alt-tabbed or loading game reports `stale` numbers, and then the timers run.
  # asleep / locked / monitor-off are never held.
  stay_lit_in_game: true

sensors:
  # auto: LHM if pythonnet+dll available, else psutil+NVML. Or force: lhm | fallback | demo
  backend: auto
  interval_s: 1.0

power:
  # total = base + (cpu + gpu) * (1 + rail_overhead_pct/100)
  #
  # base_w — everything on the 24-pin/aux rails that sensors can't see,
  # researched for this exact build (2026-07):
  #   board logic+chipset (X870E dual-PCH ProArt, HWCooling 24-pin clamp data
  #     says 15-25W idle / up to ~40W loaded on feature-heavy boards) ... 20
  #   2x DDR5-6400 32GB (1.5W idle ... 5W memory-heavy) ..............    3
  #   SN850X 8TB NVMe (0.05W idle, ~1W typical, 9W burst) ...........    1.5
  #   5 case fans (~0.8-1.5W each at PWM duty) ......................    6
  #   Liquid Freezer III 360 pump (max ~3W) + its 3 fans ............    5.5
  #   WiFi/BT, USB, front panel, misc ................................    3
  #   ≈ 39 W when working, ~30 W at idle → midpoint 34
  base_w: 34
  # LHM "Total Power" is at the CPU socket and NVML power at the card plug;
  # VRM conversion (~5%) + PSU loss (~4%) sit upstream of both.
  rail_overhead_pct: 9
  cpu_tdp: 170        # 7950X PPT — used only when no power sensor exists
  gpu_tdp: 575        # RTX 5090
  gradient_min_w: 50   # color: green at/below this
  gradient_max_w: 1000 # color: red at/above this
  gradient_gamma: 0.75
  # --- what the panel does when the machine itself changes state -------------
  # Read from Windows power/broadcast notifications (app/hoststate.py), not guessed:
  # a hidden top-level window receives WM_POWERBROADCAST (suspend/resume), the
  # console-display power setting (the monitors going off on their own timeout), and
  # the session lock. If no event window can exist, the loop's own tick gap still
  # catches a suspend, so the wake half keeps working regardless.
  follow_sleep: true      # dark while the PC is asleep; back on when it is not
  follow_lock: true       # dark while the session is locked - nobody is at the desk
  follow_display: true    # dark while Windows has turned the displays off
  # Windows reports display-power *changes*, so a start-up while the screens are
  # already off is told nothing. Derive it once from the idle clock against the power
  # scheme's own timeout (measured here: 300 s on AC) instead of sitting lit until the
  # idle timer; `[monitor]` in log.log prints the reasoning and `[beat]` marks the
  # value `(seed)` until a real notification replaces it.
  seed_monitor: true
  # A tick gap bigger than this means the process was frozen: the panel link is
  # rebuilt, the ETW capture is restarted, and the game lock is dropped.
  wake_gap_s: 5.0

# Night mode: the panel follows YOUR night mode instead of owning a schedule.
# "auto" reads Windows Night light from CloudStore (the toggle in Quick Settings and
# its scheduled transitions) and also looks at the gamma ramp the OS is applying, so
# a third-party warmer (f.lux, LightBulb) is followed too. Nothing is invented: if
# the state cannot be read it says so in log.log and falls back to `schedule`.
night:
  mode: auto            # auto | on | off
  refresh_s: 3.0        # how often to re-read it (a toggle lands in ~3 s)
  strength: 1.0         # 1.0 = the colour temperature you set; lower blends to neutral
  color_temp_k: 0       # 0 = whatever Windows has set; a number overrides it
  schedule: ""          # e.g. "21:00-07:00" — only used when the state can't be read
  # A failed or unreadable read is a transient failure, not you turning night
  # off: the panel keeps the last confirmed night appearance while it lasts,
  # holding it (never brightening) even past this grace, with one log line on
  # entering the hold and one when the grace runs out. See app/nightlight.py.
  hold_grace_s: 900
  # Night mode also dims, or a 45%-brightness panel in a dark room is the light you
  # just turned off at the lamp: level = max(floor, level x scale).
  brightness_scale: 0.55
  brightness_floor: 8
  check_gamma_ramp: true
  ramp_warm_margin: 0.12   # R-B at 50% tone before the ramp counts as warm

game:
  # explicit process names (lowercase .exe) that always trigger game mode
  processes: []
  # never trigger from these
  ignore:
    - explorer.exe
    - dwm.exe
    - taskmgr.exe
    - windowsinternal.composableshell.experiences.exe
    - searchapp.exe
    - searchhost.exe
    - startmenuexperiencehost.exe
    - applicationframehost.exe
    - phonolink.exe
  # heuristic: true fullscreen foreground window + gpu busy for this many seconds
  fullscreen_heuristic: true
  min_gpu_load: 10
  enter_after_s: 4
  exit_after_s: 25
  # dashed reference line in the in-game frametime graph (16.7 ms = 60 fps)
  frametime_target_ms: 16.7
  # Present-based detection: GAME when the foreground process is actually
  # presenting frames (needs the `frames` source below, i.e. admin). The window
  # heuristic above remains the fallback for light games under the present
  # threshold and whenever ETW is unavailable.
  present_detection: true
  # --- how the detector decides, per confidence tier (app/gamewatch.py) ---------
  detection:
    # A foreground process presenting over its whole monitor is not a maybe: it gets
    # in on this clock instead of the flat enter_after_s, which is what made a game
    # start feel slow. Everything weaker waits enter_after_s.
    enter_strong_s: 1.2
    # Once locked, the frame target is not stolen by another presenter. It is
    # released when the process disappears (dead_exit_s, after the 2 s liveness
    # window) or when it stops presenting altogether (exit_after_s above).
    dead_exit_s: 3.0
    # Target quiet for this long while something else renders confidently -> the new
    # process gets the lock (starting game B from game A's desktop).
    switch_silence_s: 3.0
    # % of the frame the GPU spent busy for a process before "busy" counts as
    # evidence it is a title and not a video: measured here at ~100% for a game and
    # ~19% for a scrolling browser, on PresentMon's own MsGPUBusy column.
    min_gpu_score: 55.0
    # Presenters that are never the game, however busy they are (browsers, chat, the
    # shell, capture tools). Uncomment to replace the built-in list.
    # non_game: [chrome.exe, msedge.exe, firefox.exe, spotify.exe, discord.exe]

# Real frame telemetry (fps / frametime / 1%/0.1% low) per process, from the
# GameTechDev PresentMon ETW stream — zero injection, works for DX/Vulkan/GL/UWP.
# Requires Administrator (ETW kernel session); without it the panel honestly
# shows "--". Fetch the pinned binary once:
#   powershell -File tools\fetch_presentmon.ps1
frames:
  source: auto          # auto | off
  path: vendor/presentmon/presentmon.exe
  min_present_fps: 24   # presenting at/above this ⇒ the process "is a game"
  window_s: 60          # percentile window for the low counts
  # Only frames the OS attributed to a display are counted — the honest "fps".
  # But attribution is the OS/driver's call: where the flip path isn't attributed
  # this flag filters everything away, so it has to be switchable.
  exclude_dropped: true
  # ETW session role. Same role = take the session over from the previous run of
  # itself; a different role = capture alongside it. Empty means "main".
  role:
  # Diagnostic: write the raw capture here instead of streaming it. Frame stats
  # are off by design in this mode — the file is the artifact (tools/ab_capture.ps1).
  output_file:
  # A game that stops presenting (alt-tab, a loading screen) keeps its last
  # measurement on the panel for this long — dimmed, labelled HELD — before the
  # numbers go to `--`. Never a fabricated live rate.
  hold_s: 12

burnin:
  shift_every_min: 5       # global pixel-shift of the layout
  exercise_every_h: 8      # full-screen color sweep "refresh" animation
  exercise_s: 12

layout:
  # fonts resolve relative to the vendored library res/ folder
  font_value: jetbrains-mono/JetBrainsMono-ExtraBold.ttf
  font_label: roboto/Roboto-Bold.ttf
  font_small: roboto/Roboto-Medium.ttf
  # seconds of history drawn in the trend bands (= samples at interval_s: 1 Hz)
  trend_window_s: 60
  # Trend bands cost nothing on TUR_USB (each push is PNG-encoded: ~50 KB for a
  # whole frame) but they are impossible on the 115200-baud serial revisions,
  # where one full frame would take ~68 s. Set false for those boards: the bands
  # collapse to plain level bars and only the digits change.
  trend_bands: true
  # idle <-> game: the three bottom slots swap content (RAM|DISK|NET -> FRAMES|RAM|DISK).
  # "wipe" pushes a dark frame, holds, then the new layout, so the old one does not
  # ghost through the panel's slow pixels. Ignored on the serial revisions (A/B/C/D,
  # WeAct), where an extra frame is physically unaffordable. "none" never wipes.
  transition: wipe
  transition_hold_s: 0.12
