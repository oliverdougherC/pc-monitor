name: offline gate

# The app is Windows-only in practice (ctypes/win32 power & session calls, a
# COM-port panel, an ETW capture), so the gate runs on a Windows runner: on
# Linux these modules do not even import, and a green bar there would prove
# nothing about the code that ships.
#
# What this gate covers is what can be proven without the hardware: the
# selftests under tools/. What it cannot cover is said out loud (see the job
# summary): physical panel, USB, ETW and admin behaviour stay a documented
# manual step; the case list lives with the "Run now" section of the README.
#
# The gate is only representative if the vendor-boundary cases actually run.
# On a bare checkout seven of them used to SKIP — panel_link, open_serial,
# usb_reset, diff_cache, lights, units, layout — precisely the
# transport/appearance boundaries where the reliability reviews found their
# residual defects (issue #9's swallowed write timeout lives in the pinned
# vendor's WriteLine). So this workflow *fetches the pinned tree first* and
# runs the suite with `--strict`, where a case that needs an absent asset is
# a FAIL, not a SKIP (issue #30): a green bar can no longer mean the pinned
# transport adapter was never installed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The same manifest a fresh clone installs (tools/bootstrap.ps1 runs the
      # identical command), so CI exercises the reviewed dependency set instead of
      # a list maintained somewhere else. tools/env_check_selftest.py fails if the
      # two ever drift apart. Install failures must stop the job, so no
      # `|| continue` anywhere here.
      - name: Install the reviewed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Syntax across the whole tree, including the modules the selftests do
      # not import (the vendored-library ones) and the PowerShell-free tools.
      - name: Byte-compile
        run: python -m compileall -q app tools main.py

      # Install exactly the revision vendor/LOCK.txt names — staged, hashed
      # against the committed lock, and only then moved into place — and
      # re-verify it from disk. The fetch never rewrites the lock, so CI
      # cannot bless a moving upstream branch: if the commit the lock names
      # no longer hashes the same, this fails the job rather than the review.
      - name: Fetch and verify the pinned vendor tree
        shell: pwsh
        run: |
          ./tools/vendor_lock.ps1 -Fetch
          ./tools/vendor_lock.ps1 -Verify

      # `--strict`: a case that needs the vendored tree or the theme fonts and
      # cannot run is a FAIL. Native/hardware behaviour (real USB, ETW, sleep,
      # driver resets) still is not proven here — that stays the documented
      # soak in docs/reliability-plan.md, not an implied pass.
      - name: Offline selftests (strict)
        run: python tools\run_offline_tests.py --strict
