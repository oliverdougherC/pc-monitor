name: offline gate

# The app is Windows-only in practice (ctypes/win32 power & session calls, a
# COM-port panel, an ETW capture), so the gate runs on a Windows runner: on
# Linux these modules do not even import, and a green bar there would prove
# nothing about the code that ships.
#
# What this gate covers is what can be proven without the hardware: the
# selftests under tools/. What it cannot cover is said out loud — the runner
# reports the vendored-library cases as SKIP, not as passing (see the job
# summary). Physical panel, USB, ETW and admin behaviour stay a documented
# manual step; the case list lives with the "Run now" section of the README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # There is no application-level dependency manifest yet (tracked as an
      # open issue); this list is the set the offline tests import, taken from
      # the venv this repository is developed in. Install failures must stop
      # the job, so no `|| continue` anywhere here.
      - name: Install the offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow psutil pyserial pyusb PyYAML numpy nvidia-ml-py

      # Syntax across the whole tree, including the modules the selftests do
      # not import (the vendored-library ones) and the PowerShell-free tools.
      - name: Byte-compile
        run: python -m compileall -q app tools main.py

      - name: Offline selftests
        run: python tools\run_offline_tests.py